<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abrir Chamado</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
    <h1>Abrir Chamado Técnico</h1>
    <form action="salvar.php" method="POST">
        <label for="solicitante">Seu nome</label>
        <input type="text" id="solicitante" name="solicitante" required maxlength="100">

        <label for="equipamento">Equipamento</label>
        <select id="equipamento" name="equipamento" required>
            <option value="">Selecione...</option>
            <option value="Computador">Computador</option>
            <option value="Projetor">Projetor</option>
            <option value="Internet">Internet</option>
            <option value="Impressora">Impressora</option>
        </select>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade" required>
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
        </select>

        <label for="descricao">Descreva o problema</label>
        <textarea id="descricao" name="descricao" rows="4" required minlength="10" maxlength="1000"></textarea>

        <button type="submit">Enviar chamado</button>
    </form>
    <p><a href="lista.php">Ver chamados abertos</a></p>
</main>
</body>
</html>
